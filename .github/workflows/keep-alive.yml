name: Keep Render Awake

on:
  schedule:
    # cron 用 UTC，台灣 12:00-20:00 = UTC 04:00-12:00；週一(1)公休不排
    - cron: '*/10 4-11 * * 2-6,0'  # 12:00-19:50
    - cron: '0 12 * * 2-6,0'       # 20:00 收尾
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -f "${{ secrets.RENDER_URL }}/api/health"
